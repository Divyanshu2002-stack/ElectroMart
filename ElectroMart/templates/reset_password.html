
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | ElectroMart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
<header class="navbar">
    <a class="brand" href="{{ url_for('home') }}">⚡ ElectroMart</a>
</header>

<main class="login-card">
    <span class="eyebrow">SECURE ACCOUNT RECOVERY</span>
    <h1>Choose a new password</h1>
    <p>Choose a strong password you have not used for this account before.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="password">New password</label>
        <input id="password" name="password" type="password" required
               minlength="12" maxlength="128" autocomplete="new-password">

        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password"
               required minlength="12" maxlength="128"
               autocomplete="new-password">

        <button class="btn full-width" type="submit">Reset password</button>
    </form>
</main>
</body>
</html>
