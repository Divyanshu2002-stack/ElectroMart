<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Edit Product - {{ p['name'] }}</title><style>body{font-family:system-ui;background:#f1f5f9;margin:0} .wrap{max-width:600px;margin:20px auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.05)} input,select,textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:10px;box-sizing:border-box} button{width:100%;padding:12px;background:#0f172a;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer} label{font-weight:600;font-size:13px}</style></head><body><div class="wrap"><h2>✏️ Edit - {{ p['name'] }}</h2><p style="font-size:12px;color:#64748b">Product ID: {{ p['id'] }}</p><form method="POST" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name</label><input name="name" value="{{ p['name'] }}" required><label>Category</label><select name="category">{% for c in categories %}<option value="{{ c }}" {% if c==p['category'] %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><label>Price ₹</label><input type="number" step="0.01" name="price" value="{{ p['price'] }}" required><label>Stock</label><input type="number" name="stock" value="{{ p['stock'] }}" required><label>Description</label><textarea name="description" rows="4">{{ p['description'] }}</textarea><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px"><div><label>Current Photo</label>{% if p['image'] %}<img src="{{ url_for('static', filename='uploads/' + p['image']) }}" style="width:100%;height:100px;object-fit:cover;border-radius:8px">{% else %}<p style="font-size:12px">No photo</p>{% endif %}<input type="file" name="photo" accept="image/*" style="margin-top:6px"></div><div><label>Current Video</label>{% if p['video'] %}<video src="{{ url_for('static', filename='uploads/' + p['video']) }}" style="width:100%;height:100px;border-radius:8px" controls></video>{% else %}<p style="font-size:12px">No video</p>{% endif %}<input type="file" name="video" accept="video/*" style="margin-top:6px"></div></div><button style="margin-top:16px">Update Product ✏️ Save</button></form><a href="/owner" style="display:block;text-align:center;margin-top:14px;color:#475569;text-decoration:none">← Back to Owner Dashboard</a></div></body></html>
