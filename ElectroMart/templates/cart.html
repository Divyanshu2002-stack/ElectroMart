<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cart</title><style>body{font-family:sans-serif;background:#f1f5f9;margin:0}.nav{background:#0f172a;color:#fff;padding:14px 20px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:700px;margin:20px auto}.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px}</style></head><body><div class="nav"><a href="/">⚡ ElectroMart</a></div><div class="wrap"><h2>Cart</h2>{% for item in cart_items %}<div class="card">{{ item.product['name'] }} - ₹{{ item.subtotal|int }}</div>{% endfor %}{% if cart_items %}<a href="/checkout">Checkout</a>{% else %}<p>Empty Cart</p>{% endif %}</div></body></html>
