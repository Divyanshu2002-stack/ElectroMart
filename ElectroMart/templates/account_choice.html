<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account - ElectroMart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:linear-gradient(120deg,#020617,#1e3a8a,#2563eb,#0ea5e9);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:380px;border-radius:22px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center}
.logo{font-weight:900;font-size:22px;color:#0f172a;margin-bottom:6px}
.sub{color:#64748b;font-size:13px;margin-bottom:22px}
.btn{display:block;width:100%;padding:14px;border-radius:14px;text-decoration:none;font-weight:700;font-size:14px;margin:10px 0;transition:0.2s}
.btn-user{background:#0f172a;color:#fff}
.btn-admin{background:#e0f2fe;color:#0369a1;border:1px solid #7dd3fc}
.btn-reg{background:#f1f5f9;color:#0f172a;border:1px solid #e2e8f0}
.btn:hover{transform:translateY(-2px)}
.back{color:#94a3b8;font-size:13px;text-decoration:none;margin-top:12px;display:inline-block}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡ ElectroMart</div>
  <div class="sub">Choose Login Type</div>
  <a href="/login" class="btn btn-user">🔑 User Login</a>
  <a href="/owner/login" class="btn btn-admin">👑 Admin Login</a>
  <a href="/register" class="btn btn-reg">📝 Register</a>
  <a href="/" class="back">← Back to Home</a>
</div>
</body>
</html>
