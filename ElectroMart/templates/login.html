<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login | ElectroMart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <header class="navbar">
        <a class="brand" href="{{ url_for('home') }}">⚡ ElectroMart</a>
        <a href="{{ url_for('home') }}">← Back to shop</a>
    </header>

    <main class="login-card">
        <div class="login-icon">🔐</div>
        <span class="eyebrow">PRIVATE ACCESS</span>
        <h1>Owner login</h1>
        <p>Sign in to manage your products and prices.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username"
                   required maxlength="100">

            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <button class="btn full-width" type="submit">Log in securely</button>
        </form>
        <small>Owner access only.</small>
    </main>
</body>
</html>
