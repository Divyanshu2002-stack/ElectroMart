<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password - ElectroMart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:linear-gradient(120deg,#020617,#1e3a8a,#2563eb,#0ea5e9);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;width:100%;max-width:400px;border-radius:22px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.logo{text-align:center;font-weight:900;font-size:22px;color:#0f172a;margin-bottom:6px}
.sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:20px}
label{font-size:13px;font-weight:600;color:#334155;display:block;margin:12px 0 6px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e2e8f0;outline:none;font-size:14px}
input:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,0.15)}
.btn{width:100%;padding:13px;margin-top:18px;background:#0f172a;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;transition:0.2s}
.btn:hover{transform:translateY(-2px);background:#020617}
.msg{padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;text-align:center}
.msg.error{background:#fef2f2;color:#ef4444;border:1px solid #fecaca}
.msg.success{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.back{display:block;text-align:center;margin-top:14px;color:#94a3b8;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚡ ElectroMart</div>
  <div class="sub">Change Password</div>

  {% if error %}
  <div class="msg error">{{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="msg success">{{ success }}</div>
  {% endif %}

  <form method="POST">
    <label>Old Password</label>
    <input type="password" name="old_password" required placeholder="Enter old password">

    <label>New Password</label>
    <input type="password" name="new_password" required placeholder="Enter new password">

    <label>Confirm New Password</label>
    <input type="password" name="confirm_password" required placeholder="Confirm new password">

    <button type="submit" class="btn">Update Password</button>
  </form>

  <a href="/" class="back">← Back to Home</a>
</div>
</body>
</html>
